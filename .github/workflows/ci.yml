name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - run: npm ci
      - run: node --check src/server.js
      # test/isolamento_tenant.test.js precisa do Postgres local com o schema
      # + RLS da stack Supabase self-hosted (ver docs/adr/0003) — não roda
      # aqui ainda. Rodar localmente com `npm test` antes de qualquer PR que
      # mexa em RLS/RBAC.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
