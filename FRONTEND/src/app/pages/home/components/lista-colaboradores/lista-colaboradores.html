<div class="flex items-center justify-between gap-2 px-1 py-2 border-b border-linha">
  <h3 class="text-[11px] font-bold tracking-wide text-fraco uppercase">Colaboradores</h3>
  <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-azul/10 text-azul-t" *ngIf="!colaboradoresService.carregando()">
    {{ colaboradoresService.colaboradoresOrdenados().length }}
  </span>
</div>

<!-- Barra de filtros — busca + data/"ao vivo" + regional/cargo, tradução
     literal de .f-agentes-topo do protótipo. Infraestrutura (filtroColaborador
     etc.) já existia no service, só faltava esta UI. -->
<div class="flex flex-col gap-1.5 px-1 py-1.5 border-b border-linha">
  <div class="flex items-center gap-1.5 h-[29px] px-2 rounded-md border border-linha bg-sup-2 focus-within:border-azul focus-within:bg-sup transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-tenue shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
    <input
      type="text"
      placeholder="colaborador, cargo ou regional"
      autocomplete="off"
      class="flex-1 min-w-0 text-xs bg-transparent placeholder:text-tenue outline-none"
      [value]="colaboradoresService.filtroColaborador()"
      (input)="aoBuscar($any($event.target).value)"
    />
  </div>

  <div class="flex items-center gap-1.5">
    <input
      type="date"
      title="dia da operação"
      class="flex-1 min-w-0 h-[29px] px-2 rounded-md border border-linha bg-sup-2 text-xs text-txt outline-none focus:border-azul focus:bg-sup transition-colors"
      [value]="colaboradoresService.filtroData()"
      (change)="aoMudarData($any($event.target).value)"
    />
    <button
      type="button"
      (click)="voltarParaHoje()"
      title="voltar pro dia atual (mantém atualizando sozinho a cada minuto)"
      class="shrink-0 h-[29px] px-2.5 rounded-md text-[11px] font-semibold transition-colors cursor-pointer"
      [ngClass]="
        colaboradoresService.filtroData() === hojeIso()
          ? 'bg-azul text-white'
          : 'bg-sup-2 border border-linha text-fraco hover:text-azul hover:border-azul/50'
      "
    >
      ao vivo
    </button>
  </div>

  <div class="flex items-center gap-1.5">
    <select
      title="regional"
      class="flex-1 min-w-0 h-[29px] px-2 rounded-md border border-linha bg-sup-2 text-xs text-txt outline-none focus:border-azul transition-colors"
      [value]="colaboradoresService.filtroRegional()"
      (change)="aoMudarRegional($any($event.target).value)"
    >
      <option value="">todas as regionais</option>
      <option *ngFor="let regional of colaboradoresService.regionais()" [value]="regional">{{ regional }}</option>
    </select>
    <select
      title="cargo"
      class="flex-1 min-w-0 h-[29px] px-2 rounded-md border border-linha bg-sup-2 text-xs text-txt outline-none focus:border-azul transition-colors"
      [value]="colaboradoresService.filtroCargo()"
      (change)="aoMudarCargo($any($event.target).value)"
    >
      <option value="">todos os cargos</option>
      <option *ngFor="let cargo of colaboradoresService.cargos()" [value]="cargo">{{ rotuloCargo(cargo) }}</option>
    </select>
  </div>
</div>

<div class="flex flex-wrap gap-1 px-1 py-1.5 border-b border-linha">
  <button
    type="button"
    *ngFor="let opcao of opcoesCategoria"
    (click)="toggleCategoria(opcao.valor)"
    class="text-[10.5px] font-semibold px-2.5 py-1 rounded-full border transition-colors cursor-pointer"
    [ngClass]="
      colaboradoresService.filtroCategoria() === opcao.valor
        ? 'bg-azul text-white border-azul'
        : 'bg-sup text-fraco border-linha hover:border-azul/50 hover:text-azul'
    "
  >
    {{ opcao.rotulo }} {{ colaboradoresService.contagensPorCategoria()[opcao.valor] }}
  </button>
</div>

<div class="px-1 py-8 text-center text-tenue text-xs" *ngIf="colaboradoresService.carregando()">
  Carregando...
</div>

<div class="px-1 py-8 text-center text-critico text-xs" *ngIf="colaboradoresService.erro() && !colaboradoresService.carregando()">
  {{ colaboradoresService.erro() }}
</div>

<div
  class="px-1 py-8 text-center text-tenue text-xs"
  *ngIf="!colaboradoresService.carregando() && !colaboradoresService.erro() && !colaboradoresService.colaboradores().length"
>
  Nenhum colaborador encontrado.
</div>

<ul
  class="flex-1 min-h-0 space-y-0.5 overflow-y-auto pr-0.5"
  *ngIf="!colaboradoresService.carregando() && !colaboradoresService.erro() && colaboradoresService.colaboradores().length"
>
  <!-- Item de lista no padrão "ag-campo" do protótipo de referência: linha
       única compacta, sem expandir ao clicar — clicar só seleciona (abre o
       painel de detalhe, app-colaborador-detalhe, que já reage a
       colaboradorSelecionado). Jornada (barra trabalhado/ocioso + km/
       ocupação) e a lista de livros do dia, que antes expandiam AQUI,
       migraram pro painel de detalhe (ver colaborador-detalhe.html) — só a
       barra fina de % de execução do dia (mesma barra-dia do protótipo)
       fica na lista, junto com um resumo em uma linha. -->
  <li
    *ngFor="let colaborador of colaboradoresService.colaboradoresOrdenados()"
    #linhaColaborador
    [attr.data-colaborador]="colaborador.colaborador"
  >
    <button
      type="button"
      (click)="selecionar(colaborador.colaborador)"
      class="relative w-full text-left px-2.5 py-2 border-b border-linha border-l-[3px] transition-colors cursor-pointer"
      [ngClass]="
        colaboradoresService.colaboradorSelecionado() === colaborador.colaborador
          ? 'bg-callout border-l-azul'
          : 'border-l-transparent hover:bg-sup-2'
      "
    >
      <!-- l1: nome (mono) + contador de realizadas, cor por faixa de
           execução (mesmos limiares de corBarra — ≥70% ok, 30-69% alerta,
           <30% crítico, sem atividade neutro). -->
      <div class="flex items-center gap-1.5">
        <span class="font-mono text-xs font-semibold text-tit truncate min-w-0 flex-1">{{ colaborador.colaborador }}</span>
        <span
          class="shrink-0 font-mono text-[11px] font-semibold text-white rounded-full px-1.5 min-w-[20px] text-center"
          [ngClass]="{
            'bg-ok': colaboradoresService.atividadeDe(colaborador.colaborador) && corBarra(colaboradoresService.atividadeDe(colaborador.colaborador)) === 'verde',
            'bg-alerta': colaboradoresService.atividadeDe(colaborador.colaborador) && corBarra(colaboradoresService.atividadeDe(colaborador.colaborador)) === 'amarelo',
            'bg-critico': colaboradoresService.atividadeDe(colaborador.colaborador) && corBarra(colaboradoresService.atividadeDe(colaborador.colaborador)) === 'vermelho',
            'bg-linha-2': !colaboradoresService.atividadeDe(colaborador.colaborador)
          }"
          [title]="
            colaboradoresService.atividadeDe(colaborador.colaborador)
              ? colaboradoresService.atividadeDe(colaborador.colaborador)!.totalRealizadas + ' realizadas · ' + colaboradoresService.atividadeDe(colaborador.colaborador)!.totalPendentes + ' a realizar'
              : 'Nenhuma atividade registrada ' + colaboradoresService.rotuloDataAtividade()
          "
        >{{ colaboradoresService.atividadeDe(colaborador.colaborador)?.totalRealizadas ?? '—' }}</span>
      </div>

      <!-- Ausência cadastrada — selo mono/pill (mesmo padrão do "selo" do
           protótipo), roxo pra ausência simples, crítico quando diverge do
           campo (afastado mas com atividade real hoje). -->
      <div class="flex items-center gap-1 mt-1" *ngIf="colaboradoresService.afastamentoDe(colaborador.colaborador) as af">
        <span
          class="font-mono text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-full bg-roxo/15 text-roxo-t"
          [title]="(af.motivoAfastamento || 'Ausência justificada') + (af.afastadoInss === 'SIM' ? ' (INSS)' : '')"
        >ausência cadastrada</span>
        <span
          *ngIf="colaboradoresService.atividadeDe(colaborador.colaborador)"
          class="font-mono text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-full bg-alerta/15 text-laranja-t"
          title="Afastado com atividade em campo — o cadastro e o campo divergem"
        >com atividade</span>
      </div>

      <!-- barra-dia: % de execução do dia (mesma métrica que ordena a
           lista — mais críticos primeiro). Só aparece com atividade
           registrada hoje. -->
      <div
        *ngIf="colaboradoresService.atividadeDe(colaborador.colaborador) as atividadeBarra"
        class="h-[5px] rounded-full overflow-hidden bg-linha mt-1.5"
        [title]="(percentual(colaborador.colaborador) | number: '1.0-0') + '% executado hoje'"
      >
        <div
          class="h-full rounded-full transition-[width]"
          [style.width.%]="percentual(colaborador.colaborador)"
          [ngClass]="{
            'bg-ok': corBarra(atividadeBarra) === 'verde',
            'bg-alerta': corBarra(atividadeBarra) === 'amarelo',
            'bg-critico': corBarra(atividadeBarra) === 'vermelho'
          }"
        ></div>
      </div>

      <!-- l2: cargo curto · regional -->
      <div class="text-[11.5px] text-txt truncate mt-1">{{ rotuloCargo(colaborador.cargo) }} · {{ regionalDe(colaborador.base) }}</div>

      <!-- l3: bateria (mono, cor por faixa) · sem transmitir há (crítico
           acima do limite) · contagem de livros (sem lista — a lista
           completa está no painel de detalhe). -->
      <div class="flex items-center gap-2 font-mono text-[9.5px] text-tenue flex-wrap mt-1">
        <span
          *ngIf="colaboradoresService.scalefusionDe(colaborador.colaborador) as posicao"
          class="inline-flex items-center gap-0.5 font-bold"
          [ngClass]="corBateria(posicao.bateria_percentual)"
          [title]="'Bateria do aparelho: ' + posicao.bateria_percentual + '%' + (posicao.bateria_carregando ? ' (carregando)' : '')"
        >▮ {{ posicao.bateria_percentual }}%</span>
        <ng-container *ngIf="colaboradoresService.atividadeDe(colaborador.colaborador) as atividadeSync; else semAtividadeL3">
          <span [ngClass]="atividadeSync.minutosParado >= 30 ? 'text-critico font-semibold' : ''">
            {{ tempoSemSincronizar(atividadeSync.minutosParado) }} sem transmitir
          </span>
          <span>{{ atividadeSync.totalLivros }} livro{{ atividadeSync.totalLivros === 1 ? '' : 's' }}</span>
        </ng-container>
        <ng-template #semAtividadeL3>
          <span *ngIf="!colaboradoresService.afastamentoDe(colaborador.colaborador)">sem serviço {{ colaboradoresService.rotuloDataAtividade() }}</span>
        </ng-template>
      </div>
    </button>
  </li>
</ul>
