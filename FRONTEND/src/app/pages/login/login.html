<div class="min-h-screen flex flex-col bg-fundo">
  <!-- Filete de marca — mesmo padrão de home.html (22% laranja / 78% navy). -->
  <div class="shrink-0 h-[3px] w-full flex" aria-hidden="true">
    <div class="basis-[22%] bg-laranja"></div>
    <div class="basis-[78%] bg-navy"></div>
  </div>

  <div class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="bg-sup border border-linha rounded-xl shadow-xl p-8">
        <div class="flex flex-col items-center mb-7">
          <!-- Ícone de olho, flat, mesma linguagem dos outros ícones do app —
               não o favicon-olho.png (ilustração 3D detalhada, incompatível
               com o sistema de design flat/tokens desta rodada). -->
          <div class="w-12 h-12 rounded-xl bg-navy flex items-center justify-center shadow-sm mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
          <h1 class="text-lg font-bold text-tit tracking-tight">Olho de Deus</h1>
          <p class="text-[11px] font-mono text-tenue tracking-wide mt-0.5">supervisão de campo</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label for="email" class="block text-[10.5px] font-bold uppercase tracking-wide text-fraco mb-1.5">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="seu@email.com"
              required
              class="w-full px-3 py-2 bg-sup-2 border border-linha rounded-md text-sm text-txt placeholder:text-tenue focus:outline-none focus:border-azul focus:bg-sup transition-colors"
            />
          </div>

          <div>
            <label for="senha" class="block text-[10.5px] font-bold uppercase tracking-wide text-fraco mb-1.5">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              [(ngModel)]="senha"
              placeholder="••••••••"
              required
              class="w-full px-3 py-2 bg-sup-2 border border-linha rounded-md text-sm text-txt placeholder:text-tenue focus:outline-none focus:border-azul focus:bg-sup transition-colors"
            />
          </div>

          <p *ngIf="erro()" class="text-critico text-xs -mt-1">{{ erro() }}</p>

          <div class="flex items-center">
            <input
              type="checkbox"
              id="manterConectado"
              name="manterConectado"
              [(ngModel)]="manterConectado"
              class="h-3.5 w-3.5 rounded border-linha text-azul focus:ring-azul"
            />
            <label for="manterConectado" class="ml-2 text-xs text-fraco">
              manter conectado neste navegador
            </label>
          </div>

          <button
            type="submit"
            [disabled]="carregando()"
            class="w-full py-2.5 rounded-md text-sm font-semibold text-white transition-colors cursor-pointer"
            [ngClass]="carregando() ? 'bg-navy/50 cursor-not-allowed' : 'bg-navy hover:bg-navy/90'"
          >
            {{ carregando() ? 'Entrando...' : 'Entrar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
